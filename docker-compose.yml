name: roe-capital

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      TG_SYNC_URL: http://tg-sync:${TG_SYNC_HTTP_PORT:-3010}
    expose:
      - "${API_PORT:-3000}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./web
      args:
        API_PORT: ${API_PORT:-3000}
    restart: unless-stopped
    env_file: .env
    environment:
      API_UPSTREAM: api:${API_PORT:-3000}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started

  # Опциональный импорт/бекап JSON. НЕ стартует с up — только вручную:
  # docker compose run --rm seed
  seed:
    build:
      context: .
      dockerfile: seed/Dockerfile
    profiles:
      - seed
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  # Автосбор сделок из Telegram (user-сессия + OpenRouter).
  # Первичная авторизация: docker compose run --rm tg-sync auth
  tg-sync:
    build:
      context: .
      dockerfile: tg-sync/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TG_SESSION_PATH: /data/session/roe
      TG_BACKUPS_DIR: /data/backups
      TG_WORK_DIR: /data/work
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-5.6-luna}
      TG_SYNC_POLL_SECONDS: ${TG_SYNC_POLL_SECONDS:-20}
      TG_SYNC_HTTP_PORT: ${TG_SYNC_HTTP_PORT:-3010}
    expose:
      - "${TG_SYNC_HTTP_PORT:-3010}"
    volumes:
      - tg-session:/data/session
      - tg-backups:/data/backups
      - tg-work:/data/work
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  pgdata:
  tg-session:
  tg-backups:
  tg-work:

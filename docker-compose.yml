name: roe-capital

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
    expose:
      - "${API_PORT:-3000}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./web
      args:
        API_PORT: ${API_PORT:-3000}
    restart: unless-stopped
    env_file: .env
    environment:
      API_UPSTREAM: api:${API_PORT:-3000}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started

  # Разовая задача: заливает исторические сделки в базу.
  # Запуск: docker compose run --rm seed
  seed:
    build:
      context: .
      dockerfile: seed/Dockerfile
    profiles:
      - seed
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
